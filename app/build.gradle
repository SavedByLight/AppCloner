plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.savedbylight.appcloner'
    compileSdk 34

    defaultConfig {
        applicationId "com.savedbylight.appcloner"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    // Release signing is populated from environment variables in CI
    // (see .github/workflows/build.yml), which decodes the KEYSTORE_BASE64
    // secret to a file and exports the passwords/alias as env vars.
    // Locally, set these in your shell or a gradle.properties that is
    // gitignored if you want to build a signed release APK yourself.
    def keystorePath = System.getenv("KEYSTORE_FILE")
    def hasReleaseSigning = keystorePath != null && file(keystorePath).exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += [
                "META-INF/versions/9/OSGI-INF/MANIFEST.MF",
                "META-INF/*.RSA",
                "META-INF/*.SF",
                "META-INF/*.DSA"
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Binary AndroidManifest.xml (AXML) reader/writer — lets us rewrite the
    // package name and provider authorities without a full apktool decompile.
    // Note: this is published as de.upb.cs.swt:axml on Maven Central (a
    // maintained fork of the original pxb.android:axml, which was never
    // published there). The Java package is still pxb.android.axml, so no
    // source changes are needed.
    implementation 'de.upb.cs.swt:axml:2.1.3'

    // APK v2/v3 signing, straight from AOSP's apksigner sources.
    implementation 'com.android.tools.build:apksig:8.4.1'

    // Self-signed cert generation for the throwaway clone signing key
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}
