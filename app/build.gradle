plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.savedbylight.appcloner'
    compileSdk 34

    defaultConfig {
        applicationId "com.savedbylight.appcloner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.9.04"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("appcloner-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Cryptography library used for certificate generation and signing
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

    // APK re-signing (com.android.apksig.ApkSigner) — published by Google,
    // version pinned to match the AGP version above.
    implementation 'com.android.tools.build:apksig:8.4.1'

    // Binary AndroidManifest.xml (AXML) reader/writer (pxb.android.axml.*)
    implementation 'de.upb.cs.swt:axml:2.1.3'

    // dex bytecode reader/writer (org.jf.dexlib2.*), used by DexPatcher.kt to fix
    // hardcoded self-package string constants (e.g. the GitHub app's
    // setComponentEnabledSetting SecurityException on clone). Confirmed to exist at
    // version 2.5.2 on Maven Central as of this writing; if it 404s, this project
    // migrated to Google's AOSP-hosted fork — try
    // 'com.android.tools.smali:smali-dexlib2:<latest>' instead.
    implementation 'org.smali:dexlib2:2.5.2'
    implementation 'org.smali:util:2.5.2'

    // Any other local library jars/aars placed in app/libs/, if present.
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
