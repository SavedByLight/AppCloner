name: Build and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/appcloner-release.jks"

      - name: Verify decoded keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -storepass "$KEYSTORE_PASSWORD" \
            -keystore "$RUNNER_TEMP/appcloner-release.jks" \
            || { echo "::error::KEYSTORE_BASE64 does not decode to a valid keystore (check for line-wrapping or double-encoding when the secret was generated)"; exit 1; }

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/appcloner-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/appcloner-release.jks"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppCloner-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: AppCloner-release-apk
          path: dist

      - name: Generate release tag
        id: vars
        run: echo "tag=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: AppCloner ${{ steps.vars.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
